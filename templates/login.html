{% extends "base.html" %}

{% block title %}Iniciar Sesión - Avícola San Gabriel{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex flex-col justify-center items-center py-6">
  <div class="w-full max-w-sm bg-slate-900 ring-1 ring-slate-800 rounded-3xl p-6 shadow-2xl shadow-black/40">
    
    <!-- Logo e identidad -->
    <div class="-mx-6 -mt-6 mb-6 rounded-t-3xl bg-[#fefdf5] px-6 py-6 flex justify-center">
      <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Avícola San Gabriel" width="400" height="380" class="w-48 h-auto">
    </div>
    <div class="text-center mb-6">
      <h2 class="text-xl font-extrabold text-white">Iniciar sesión</h2>
      <p class="text-sm text-slate-400 mt-1">Control diario de galpón y stock</p>
    </div>

    <!-- Formulario de Login Móvil -->
    <form action="{{ url_for('login') }}" method="POST" class="space-y-4">
      <div>
        <label for="username" class="block text-sm font-semibold text-slate-200 mb-1.5">Usuario</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
            <i class="fa-solid fa-user text-sm"></i>
          </span>
          <input type="text" id="username" name="username" required autocomplete="username" autofocus
            placeholder="Tu usuario" autocapitalize="none" autocorrect="off"
            class="w-full pl-10 pr-3 py-3.5 bg-slate-950 border border-slate-700 rounded-xl text-white font-medium placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 text-base">
        </div>
      </div>

      <div>
        <label for="password" class="block text-sm font-semibold text-slate-200 mb-1.5">Contraseña</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
            <i class="fa-solid fa-lock text-sm"></i>
          </span>
          <input type="password" id="password" name="password" required autocomplete="current-password"
            placeholder="••••••••"
            class="w-full pl-10 pr-12 py-3.5 bg-slate-950 border border-slate-700 rounded-xl text-white font-medium placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 text-base">
          <button type="button" onclick="togglePasswordVisibility('password', 'eye-icon-login')" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-200 active:scale-90 p-2 focus:outline-none" title="Ver contraseña">
            <i id="eye-icon-login" class="fa-solid fa-eye text-sm"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="w-full h-14 bg-emerald-600 hover:bg-emerald-500 active:scale-[0.98] text-white rounded-xl font-bold text-base shadow-lg shadow-emerald-700/40 transition-all flex items-center justify-center space-x-2 mt-2">
        <span>Ingresar</span>
        <i class="fa-solid fa-arrow-right text-sm"></i>
      </button>
    </form>

  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  function togglePasswordVisibility(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (!input || !icon) return;

    if (input.type === 'password') {
      input.type = 'text';
      icon.classList.remove('fa-eye');
      icon.classList.add('fa-eye-slash');
    } else {
      input.type = 'password';
      icon.classList.remove('fa-eye-slash');
      icon.classList.add('fa-eye');
    }
  }
</script>
{% endblock %}
