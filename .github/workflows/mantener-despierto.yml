# Render (plan free) duerme el servicio tras 15 minutos sin visitas.
# Este workflow le pega a /health cada 10 minutos para que siga levantado.
# La URL se configura en la variable del repositorio APP_URL (Settings > Variables).
name: Mantener despierto

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping a /health
        run: |
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${{ vars.APP_URL }}/health"
